version: "3.9"
services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./hotel_bookings.csv:/app/hotel_bookings.csv
    environment:
      - APP_MODE=production

  dashboard:
    build: .
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./hotel_bookings.csv:/app/hotel_bookings.csv
    environment:
      - APP_MODE=production
