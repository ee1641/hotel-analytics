services:
  - type: web
    name: hotel-analytics-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_MODE
        value: production
      - key: PORT
        value: 8000
    disk:
      name: data
      mountPath: /app/data
      sizeGB: 1

  - type: web
    name: hotel-analytics-dashboard
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: APP_MODE
        value: production
      - key: PORT
        value: 8501
